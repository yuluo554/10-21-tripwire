[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwire"
description = "Round-trip fidelity auditor for structured data: cell-level diffs with rule attribution and stage localization."
readme = "README.md"
# 上界与 CI 覆盖对齐：CI 只验 3.10 与 3.12（.github/workflows/ci.yml 矩阵）。
# 开区间 ">=3.10" 会让 3.13+ 声明"支持"却从未验证过 —— 收紧到 <3.13 让声明=被验过的范围。
requires-python = ">=3.10,<3.13"
# PEP 639：SPDX 表达式字符串（TOML 表写法已被 setuptools 弃用，硬期限 2027-02-18）
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["csv", "excel", "roundtrip", "fidelity", "audit", "diff"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Utilities",
  "Topic :: Office/Business",
]
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8", "tomli>=2; python_version < '3.11'"]
windows = ["pywin32>=306"]

[project.scripts]
tripwire = "tripwire.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/10-21-tripwire"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "tripwire.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tripwire = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
