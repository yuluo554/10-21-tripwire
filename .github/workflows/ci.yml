name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    name: methodology gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Sprint layout gate (methodology binding)"
        run: python tools/check_sprint_layout.py
      - name: "Desensitization gate (no host paths / usernames / local proxy)"
        run: python tools/check_desensitized.py

  tests:
    name: tests py${{ matrix.python-version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: CLI smoke
        run: |
          python -m tripwire --version
          python -m tripwire validate-pipeline pipelines/pandas.json pipelines/excel_com.json pipelines/json_sqlite.json pipelines/openpyxl.json
          python -m tripwire rules --count
      - name: Tests
        run: python -m pytest -q
